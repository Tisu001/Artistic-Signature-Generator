name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cmd/launcher/go.sum

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test launcher scripts
        run: npm run test:launcher

      - name: Prepare launcher resources for Go test
        run: |
          node scripts/generate-icons.js
          Copy-Item assets\branding\app-icon.ico cmd\launcher\app-icon.ico

      - name: Test Go launcher
        working-directory: cmd/launcher
        run: go test ./...

      - name: Package portable build
        run: npm run package

      - name: Upload portable directory artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-dir-${{ github.run_id }}
          path: release/staging/艺术签名生成器/**
          retention-days: 7

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-zip-${{ github.run_id }}
          path: release/*.zip
          retention-days: 7
